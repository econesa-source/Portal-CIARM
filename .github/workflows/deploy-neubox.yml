name: Despliegue Automático Portal CIARM a Neubox (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neubox-deploy-main
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Desplegar y validar Portal 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Crear prueba de despliegue
        run: |
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > deploy-proof.txt

      - name: Diagnosticar raíz real de la cuenta FTP
        env:
          FTP_SERVER: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          FTP_USERNAME: ${{ secrets.NEUBOX_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.NEUBOX_FTP_PASSWORD }}
        run: |
          set -u
          echo "=== FTP / ==="
          curl -sS --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://$FTP_SERVER/" || true
          echo "=== FTP /portal2.ciarm.edu.mx/ ==="
          curl -sS --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://$FTP_SERVER/portal2.ciarm.edu.mx/" || true

      - name: Sincronizar archivos por FTP a Neubox — intento 1
        id: ftp_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          port: 21
          protocol: ftps
          dangerous-clean-slate: false

      - name: Esperar antes del reintento 2
        if: steps.ftp_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Sincronizar archivos por FTP a Neubox — intento 2
        id: ftp_attempt_2
        if: steps.ftp_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          port: 21
          protocol: ftps
          dangerous-clean-slate: false

      - name: Esperar antes del reintento 3
        if: steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure'
        run: sleep 30

      - name: Sincronizar archivos por FTP a Neubox — intento 3
        if: steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          port: 21
          protocol: ftps
          dangerous-clean-slate: false

      - name: Validar que portal2 publica exactamente este commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          BASE="https://portal2.ciarm.edu.mx"
          ERRORS=0

          get() {
            local url="$1"
            local out="$2"
            curl -sS -L \
              --retry 4 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -o "$out" -w '%{http_code}' "$url"
          }

          echo "=== VALIDACIÓN PÚBLICA END-TO-END ==="

          CODE="$(get "$BASE/deploy-proof.txt?sha=$EXPECTED_SHA" /tmp/proof.txt || echo 000)"
          echo "deploy-proof.txt HTTP=$CODE"
          if [ "$CODE" = "200" ] && grep -F "commit=$EXPECTED_SHA" /tmp/proof.txt >/dev/null; then
            echo "OK: el commit desplegado es visible públicamente."
          else
            echo "ERROR: FTP informó upload, pero deploy-proof.txt no corresponde al sitio público."
            ERRORS=1
          fi

          CODE="$(get "$BASE/?sha=$EXPECTED_SHA" /tmp/root.html || echo 000)"
          echo "root HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F 'src/main-v1782.js?v=18.0.5' /tmp/root.html >/dev/null && \
             grep -F 'assets/images/ciarm-logo-header-v2.png?v=18.0.5' /tmp/root.html >/dev/null; then
            echo "OK: el sitio público usa v18.0.5 y referencia el logo CIARM."
          else
            echo "ERROR: el sitio público NO usa el entrypoint v18.0.5."
            ERRORS=1
          fi

          if grep -F '<span class="nav-label">Normativa</span>' /tmp/root.html >/dev/null && \
             grep -F '<span class="nav-label">Mis obligaciones</span>' /tmp/root.html >/dev/null && \
             grep -F 'id="btn-sidebar-toggle"' /tmp/root.html >/dev/null && \
             grep -F 'id="sidebar-backdrop"' /tmp/root.html >/dev/null && \
             ! grep -F 'href="#solicitudes"' /tmp/root.html >/dev/null && \
             ! grep -F 'href="#mis-solicitudes"' /tmp/root.html >/dev/null; then
            echo "OK: sidebar conserva navegación válida y hamburguesa responsive."
          else
            echo "ERROR: el sidebar conserva vínculos semánticamente incorrectos."
            ERRORS=1
          fi

          echo "=== VALIDACIÓN AUTENTICACIÓN REAL ==="

          CODE="$(get "$BASE/src/services/authService.js?sha=$EXPECTED_SHA" /tmp/auth-service.js || echo 000)"
          echo "authService.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F '/auth-session.php' /tmp/auth-service.js >/dev/null && \
             grep -F '/auth-google.php' /tmp/auth-service.js >/dev/null && \
             grep -F '202621439702-c0sm91am6s8pl8oi6v2245hk1md3bbea.apps.googleusercontent.com' /tmp/auth-service.js >/dev/null && \
             ! grep -F 'sessionStorage' /tmp/auth-service.js >/dev/null && \
             ! grep -F 'demo-token' /tmp/auth-service.js >/dev/null; then
            echo "OK: frontend usa sesión server-side y no identidad demo."
          else
            echo "ERROR: authService no corresponde al flujo real esperado."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/loginWidget.js?sha=$EXPECTED_SHA" /tmp/login-widget.js || echo 000)"
          echo "loginWidget.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F 'GOOGLE_CLIENT_ID' /tmp/login-widget.js >/dev/null && \
             grep -F 'authenticateGoogleCredential' /tmp/login-widget.js >/dev/null && \
             ! grep -F 'btn-login-demo' /tmp/login-widget.js >/dev/null; then
            echo "OK: login real de Google está publicado."
          else
            echo "ERROR: loginWidget todavía no usa Google Identity Services real."
            ERRORS=1
          fi

          CODE="$(get "$BASE/auth-session.php?sha=$EXPECTED_SHA" /tmp/auth-session.json || echo 000)"
          echo "auth-session.php HTTP=$CODE"
          if [ "$CODE" = "401" ] && grep -F '"not_authenticated"' /tmp/auth-session.json >/dev/null; then
            echo "OK: endpoint de sesión PHP ejecuta y deniega sesión inexistente."
          else
            echo "ERROR: auth-session.php no está ejecutándose como endpoint PHP."
            ERRORS=1
          fi

          CODE="$(curl -sS -L --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"credential":"invalid-ciarm-smoke"}' \
            -o /tmp/auth-google.json -w '%{http_code}' "$BASE/auth-google.php?sha=$EXPECTED_SHA" || echo 000)"
          echo "auth-google.php invalid credential HTTP=$CODE"
          if [ "$CODE" = "401" ] && grep -F '"invalid_google_credential"' /tmp/auth-google.json >/dev/null; then
            echo "OK: backend PHP valida credencial con Google y rechaza token inválido."
          else
            echo "ERROR: auth-google.php no pudo validar el flujo Google."
            ERRORS=1
          fi

          CODE="$(curl -sS -L --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"message":"smoke","conversationID":"ciarm-smoke","launch":true}' \
            -o /tmp/voiceflow-session.json -w '%{http_code}' "$BASE/voiceflow.php?sha=$EXPECTED_SHA" || echo 000)"
          echo "voiceflow.php without session HTTP=$CODE"
          if [ "$CODE" = "401" ] && grep -F 'La sesión institucional no es válida' /tmp/voiceflow-session.json >/dev/null; then
            echo "OK: proxy Voiceflow existe y exige sesión institucional."
          else
            echo "ERROR: voiceflow.php no está protegiendo el endpoint con la sesión real."
            ERRORS=1
          fi

          CODE="$(get "$BASE/ciarm-theme.css?sha=$EXPECTED_SHA" /tmp/theme.css || echo 000)"
          echo "ciarm-theme.css HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F -- '--primary-color: #26487F;' /tmp/theme.css >/dev/null && \
             grep -F -- '--gold-color: #C1B27E;' /tmp/theme.css >/dev/null && \
             grep -F '.exact-card:hover' /tmp/theme.css >/dev/null && \
             grep -F '.logout-btn' /tmp/theme.css >/dev/null && \
             grep -F '.assistant-ai' /tmp/theme.css >/dev/null && \
             grep -F '.voiceflow-embed-target.is-expanded' /tmp/theme.css >/dev/null && \
             grep -F '.app-layout.sidebar-open .sidebar' /tmp/theme.css >/dev/null && \
             grep -F '.app-layout.sidebar-collapsed .sidebar' /tmp/theme.css >/dev/null && \
             grep -F '.header-avatar-wrap' /tmp/theme.css >/dev/null; then
            echo "OK: paleta CIARM, navegación responsive y hover están publicados."
          else
            echo "ERROR: los cambios estéticos CIARM no están publicados en el CSS público."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/solicitudesWidget.js?sha=$EXPECTED_SHA" /tmp/solicitudes.js || echo 000)"
          echo "solicitudesWidget.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F 'solicitud-file-list' /tmp/solicitudes.js >/dev/null && \
             grep -F 'formatFileSize' /tmp/solicitudes.js >/dev/null && \
             grep -F "solicitante: user.nombre" /tmp/solicitudes.js >/dev/null && \
             grep -F 'correo: user.correo' /tmp/solicitudes.js >/dev/null && \
             grep -F 'base64: base64Data' /tmp/solicitudes.js >/dev/null && \
             grep -F 'waitForTicketConfirmation' /tmp/solicitudes.js >/dev/null && \
             ! grep -F 'fetchUserContextAPI' /tmp/solicitudes.js >/dev/null && \
             ! grep -F 'AKfycbwFQW8HyJsjfWQnJLrE6XAxW0_UFFPYn59Xa90ZB38X1kmdCWlxZM4wkTunr9UN-GxUrA' /tmp/solicitudes.js >/dev/null; then
            echo "OK: Nueva Solicitud usa contrato legacy validado y confirmación de registro/adjuntos."
          else
            echo "ERROR: Nueva Solicitud no está sincronizada con BD - Sistema de Tickets."
            ERRORS=1
          fi

          if grep -F '.main-body.solicitud-screen' /tmp/theme.css >/dev/null && \
             grep -F '.voiceflow-embed-target::before' /tmp/theme.css >/dev/null; then
            echo "OK: ajustes de viewport y esquinas de Voiceflow están publicados."
          else
            echo "ERROR: faltan ajustes visuales v17.10.0 en el CSS público."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/misSolicitudesWidget.js?sha=$EXPECTED_SHA" /tmp/mis-solicitudes.js || echo 000)"
          echo "misSolicitudesWidget.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F 'action=getTickets' /tmp/mis-solicitudes.js >/dev/null && \
             grep -F 'correo_solicitante' /tmp/mis-solicitudes.js >/dev/null && \
             grep -F 'BD - Sistema de Tickets' /tmp/mis-solicitudes.js >/dev/null; then
            echo "OK: Mis Solicitudes filtra por correo de sesión."
          else
            echo "ERROR: la vista Mis Solicitudes no está publicada correctamente."
            ERRORS=1
          fi

          echo "=== VALIDACIÓN BACKEND DE TICKETS ==="
          GAS_URL='https://script.google.com/macros/s/AKfycbxy9ezQII2g5l4GIEviuQgquS2YJVzGQSJsqvOgYCBPh98Z2DDeL5sshjg2NnWUnDA/exec'
          if curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors \
               "$GAS_URL?action=getTickets&email=e.conesa%40ciarm.edu.mx&_t=$(date +%s)" \
               -o /tmp/tickets-api.json; then
            TYPE="$(jq -r 'type' /tmp/tickets-api.json 2>/dev/null || echo invalid)"
            STATUS="$(jq -r 'if type=="object" then (.status // "") else "" end' /tmp/tickets-api.json 2>/dev/null || true)"
            MESSAGE="$(jq -r 'if type=="object" then (.message // "") else "" end' /tmp/tickets-api.json 2>/dev/null || true)"
            KEYS="$(jq -r 'if type=="object" then (keys | join(",")) else "" end' /tmp/tickets-api.json 2>/dev/null || true)"
            echo "Backend shape: type=$TYPE status=$STATUS keys=$KEYS"
            if [ -n "$MESSAGE" ]; then echo "Backend message: $MESSAGE"; fi
            COUNT="$(jq -r 'if type=="array" then length elif ((.data? | type)=="array") then (.data | length) elif ((.tickets? | type)=="array") then (.tickets | length) else -1 end' /tmp/tickets-api.json 2>/dev/null || echo -1)"
            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              echo "OK: backend getTickets respondió $COUNT solicitud(es) para el correo de prueba."
            else
              echo "ERROR: backend getTickets no devolvió una lista con solicitudes."
              ERRORS=1
            fi
          else
            echo "ERROR: no se pudo consultar el backend getTickets."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/dashboardVoiceflow-v1782.js?sha=$EXPECTED_SHA" /tmp/vf.js || echo 000)"
          echo "dashboardVoiceflow-v1782.js HTTP=$CODE"

          if grep -F '<span class="exact-btn light exact-btn-disabled" aria-disabled="true">Acceder a Biblioteca</span>' /tmp/vf.js >/dev/null && \
             grep -F '<span class="exact-btn light exact-btn-disabled" aria-disabled="true">Consultar Normativa</span>' /tmp/vf.js >/dev/null && \
             grep -F '<span class="exact-btn light exact-btn-disabled" aria-disabled="true">Ver Comunicados</span>' /tmp/vf.js >/dev/null && \
             grep -F '<span class="exact-btn light exact-btn-disabled" aria-disabled="true">Gestión Administrativa</span>' /tmp/vf.js >/dev/null && \
             grep -F '<span class="exact-btn light exact-btn-disabled" aria-disabled="true">Acceso Módulo IB</span>' /tmp/vf.js >/dev/null && \
             ! grep -E 'href="#(inicio|solicitudes)" class="exact-btn light"' /tmp/vf.js >/dev/null; then
            echo "OK: módulos no implementados visibles pero sin navegación falsa."
          else
            echo "ERROR: dashboard conserva uno o más vínculos placeholder incorrectos."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/dashboardVoiceflow-v1782.js?sha=$EXPECTED_SHA" /tmp/vf.js || echo 000)"
          echo "dashboardVoiceflow-v1782.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && \
             grep -F '6a81e72529695cfeb738ad6e' /tmp/vf.js >/dev/null && \
             grep -F "mode: 'embedded'" /tmp/vf.js >/dev/null && \
             ! grep -F 'alert(' /tmp/vf.js >/dev/null; then
            echo "OK: módulo Voiceflow nuevo está publicado."
          else
            echo "ERROR: el módulo Voiceflow nuevo no está publicado correctamente."
            ERRORS=1
          fi

          CODE="$(get "$BASE/src/components/dashboardWidget.js?sha=$EXPECTED_SHA" /tmp/old-dashboard.js || echo 000)"
          echo "dashboardWidget.js HTTP=$CODE"
          if [ "$CODE" = "200" ] && grep -F 'alert(' /tmp/old-dashboard.js >/dev/null; then
            echo "DIAGNÓSTICO: el sitio público todavía expone el dashboard viejo con alert()."
          fi

          if [ "$ERRORS" -ne 0 ]; then
            echo "VALIDACIÓN FALLIDA: el contenido subido por FTP y el contenido servido por portal2.ciarm.edu.mx NO son el mismo deployment."
            exit 1
          fi

          echo "VALIDACIÓN OK: portal2.ciarm.edu.mx publica este commit, la paleta CIARM y Voiceflow embebido."
