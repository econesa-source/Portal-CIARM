name: Despliegue Automático Portal CIARM a Neubox (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neubox-deploy-main
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Desplegar en Neubox vía FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Sincronizar archivos por FTP a Neubox — intento 1
        id: ftp_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          dangerous-clean-slate: false

      - name: Esperar antes del reintento 2
        if: steps.ftp_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Sincronizar archivos por FTP a Neubox — intento 2
        id: ftp_attempt_2
        if: steps.ftp_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          dangerous-clean-slate: false

      - name: Esperar antes del reintento 3
        if: steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure'
        run: sleep 30

      - name: Sincronizar archivos por FTP a Neubox — intento 3
        if: steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NEUBOX_FTP_SERVER || 'portal2.ciarm.edu.mx' }}
          username: ${{ secrets.NEUBOX_FTP_USERNAME }}
          password: ${{ secrets.NEUBOX_FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          dangerous-clean-slate: false
