name: Importar logo CIARM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ciarm-logo.yml'

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar logo oficial y generar PNG horizontal transparente
        run: |
          python -m pip install --quiet gdown pymupdf pillow
          mkdir -p assets/images /tmp/ciarm-logo
          python - <<'PY'
          import gdown, fitz
          from PIL import Image

          file_id = "12qpXIAU0FNYKRWry62EDsZa8UX-17mFU"
          pdf = "/tmp/ciarm-logo/logo-ciarm.pdf"
          gdown.download(id=file_id, output=pdf, quiet=False)

          doc = fitz.open(pdf)
          page = doc[1]
          pix = page.get_pixmap(matrix=fitz.Matrix(3,3), alpha=False)
          raw = "/tmp/ciarm-logo/page.png"
          pix.save(raw)

          img = Image.open(raw).convert("RGBA")
          rgb = img.convert("RGB")
          mask = Image.new("L", img.size, 0)
          mp = mask.load()
          px = rgb.load()
          for y in range(img.height):
              for x in range(img.width):
                  r,g,b = px[x,y]
                  if min(r,g,b) < 245:
                      mp[x,y] = 255
          bbox = mask.getbbox()
          if not bbox:
              raise RuntimeError("No se detectó el logo en la página 2")
          img = img.crop(bbox)

          data=[]
          for r,g,b,a in img.getdata():
              if r > 248 and g > 248 and b > 248:
                  data.append((255,255,255,0))
              else:
                  data.append((r,g,b,a))
          img.putdata(data)
          img.save("assets/images/ciarm-logo-horizontal.png", optimize=True)
          print("Logo generado:", img.size)
          PY
      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/ciarm-logo-horizontal.png
          git commit -m "assets(brand): agregar logo horizontal oficial CIARM"
          git push
