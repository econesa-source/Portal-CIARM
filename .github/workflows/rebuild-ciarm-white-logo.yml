name: Rebuild CIARM White Logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-ciarm-white-logo.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar logo blanco transparente desde PDF oficial
        run: |
          python -m pip install --quiet pymupdf pillow numpy
          python - <<'PY'
          import pymupdf as fitz
          from PIL import Image
          import numpy as np

          pdf = fitz.open("assets/source/logo-ciarm.pdf")
          page = pdf[1]
          pix = page.get_pixmap(matrix=fitz.Matrix(2,2), alpha=False)
          pix.save("/tmp/logo-page.png")

          img = Image.open("/tmp/logo-page.png").convert("RGB")
          arr = np.array(img)
          dist = 255 - arr.min(axis=2)
          mask = dist > 8
          ys, xs = np.where(mask)
          if len(xs) == 0:
              raise RuntimeError("No se detectó el logo")

          x0, y0, x1, y1 = xs.min(), ys.min(), xs.max()+1, ys.max()+1
          crop = arr[y0:y1, x0:x1, :]

          alpha = np.clip((255 - crop.min(axis=2)) * 2.2, 0, 255).astype(np.uint8)
          alpha[alpha < 12] = 0

          out = np.zeros((crop.shape[0], crop.shape[1], 4), dtype=np.uint8)
          out[:,:,:3] = 255
          out[:,:,3] = alpha

          logo = Image.fromarray(out, "RGBA")
          pad = 8
          padded = Image.new("RGBA", (logo.width + 2*pad, logo.height + 2*pad), (255,255,255,0))
          padded.paste(logo, (pad,pad), logo)
          padded.save("assets/images/ciarm-logo-horizontal-white.png", optimize=True)
          print("logo", padded.size)
          PY

      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/ciarm-logo-horizontal-white.png
          git commit -m "fix(brand): regenerar logo CIARM blanco transparente"
          git pull --rebase origin main
          git push
