name: Ticket Stage 3 Frontend Contract Smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ticket-stage1-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Reproducir envío del Portal y confirmar por lectura
        env:
          API_URL: https://script.google.com/macros/s/AKfycbxy9ezQII2g5l4GIEviuQgquS2YJVzGQSJsqvOgYCBPh98Z2DDeL5sshjg2NnWUnDA/exec
        run: |
          set -euo pipefail
          MARKER="SMOKE-STAGE3-${GITHUB_RUN_ID}"
          cat > /tmp/payload.json <<JSON
          {
            "solicitante": "Ezequiel Conesa",
            "correo": "econesa@ciarm.edu.mx",
            "tipo": "Soporte Tecnológico / TI",
            "descripcion": "$MARKER",
            "prioridad": "🟢 Normal",
            "fechaProgramada": "",
            "adjuntos": [
              {
                "nombre": "stage3-smoke.png",
                "mimeType": "image/png",
                "base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
              }
            ]
          }
          JSON

          # Mismo mecanismo del frontend: form-urlencoded, parámetro postData.
          CODE="$(curl -sS             --retry 2 --retry-delay 2 --retry-all-errors             --connect-timeout 10 --max-time 60             -o /tmp/post-response.txt -w '%{http_code}'             --data-urlencode 'postData@/tmp/payload.json'             "$API_URL" || true)"
          echo "post_http=$CODE marker=$MARKER"

          FOUND=0
          for i in $(seq 1 12); do
            sleep 2
            if curl -fsSL               --connect-timeout 10 --max-time 30               "$API_URL?action=getTickets&email=econesa%40ciarm.edu.mx&_t=$(date +%s)"               -o /tmp/tickets.json; then
              if jq -e --arg m "$MARKER" '
                if type=="array" then
                  any(.[]; (.desc // .descripcion // "") == $m and
                           (.tipo // .tipo_solicitud // "") == "Soporte Tecnológico / TI" and
                           ((.driveUrl // .adjuntos_urls // "") | contains("drive.google.com/file")))
                elif ((.data? | type)=="array") then
                  any(.data[]; (.desc // .descripcion // "") == $m and
                               (.tipo // .tipo_solicitud // "") == "Soporte Tecnológico / TI" and
                               ((.driveUrl // .adjuntos_urls // "") | contains("drive.google.com/file")))
                else false end
              ' /tmp/tickets.json >/dev/null; then
                FOUND=1
                break
              fi
            fi
          done

          echo "confirmed=$FOUND"
          test "$FOUND" = "1"
