name: Ticket Stage 2 Smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ticket-stage1-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probar alta con un adjunto contra WebApp activa
        env:
          WRITE_URL: https://script.google.com/macros/s/AKfycbxy9ezQII2g5l4GIEviuQgquS2YJVzGQSJsqvOgYCBPh98Z2DDeL5sshjg2NnWUnDA/exec
        run: |
          set -euo pipefail
          MARKER="SMOKE-STAGE2-${GITHUB_RUN_ID}"
          cat > /tmp/payload.json <<JSON
          {
            "solicitante": "Ezequiel Conesa",
            "correo": "econesa@ciarm.edu.mx",
            "tipo": "Soporte Tecnológico / TI",
            "descripcion": "$MARKER",
            "prioridad": "🟢 Normal",
            "fechaProgramada": "",
            "adjuntos": [
              {
                "nombre": "stage2-smoke.png",
                "mimeType": "image/png",
                "base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
              }
            ]
          }
          JSON

          echo "marker=$MARKER"

          HTTP_CODE="$(curl -sS -L             --retry 3 --retry-delay 2 --retry-all-errors             --connect-timeout 10 --max-time 60             -o /tmp/response.txt -w '%{http_code}'             -H 'Content-Type: text/plain;charset=utf-8'             --data-binary @/tmp/payload.json             "$WRITE_URL")"

          echo "HTTP=$HTTP_CODE"
          echo "response_begin"
          head -c 3000 /tmp/response.txt || true
          echo
          echo "response_end"

          test "$HTTP_CODE" = "200"
          grep -F '"status":"success"' /tmp/response.txt >/dev/null
