name: Ticket Stage 4 DM03 Smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ticket-stage1-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar consulta DM03 desde WebApp activa
        env:
          API_URL: https://script.google.com/macros/s/AKfycbxy9ezQII2g5l4GIEviuQgquS2YJVzGQSJsqvOgYCBPh98Z2DDeL5sshjg2NnWUnDA/exec
        run: |
          set -euo pipefail
          curl -fsSL             --retry 3 --retry-delay 2 --retry-all-errors             --connect-timeout 10 --max-time 60             "$API_URL?action=getUserContext&email=e.conesa%40ciarm.edu.mx&_t=$(date +%s)"             -o /tmp/context.json

          TYPE="$(jq -r 'type' /tmp/context.json 2>/dev/null || echo invalid)"
          STATUS="$(jq -r 'if type=="object" then (.status // "") else "" end' /tmp/context.json 2>/dev/null || true)"
          AUTH="$(jq -r 'if type=="object" then (.data.autorizado // false) else false end' /tmp/context.json 2>/dev/null || true)"
          HAS_NAME="$(jq -r 'if type=="object" and (.data.nombre? | type)=="string" and (.data.nombre|length)>0 then "yes" else "no" end' /tmp/context.json 2>/dev/null || true)"
          HAS_AREA="$(jq -r 'if type=="object" and (.data.area? | type)=="string" and (.data.area|length)>0 then "yes" else "no" end' /tmp/context.json 2>/dev/null || true)"
          REASON="$(jq -r 'if type=="object" then (.data.reason // .message // "") else "" end' /tmp/context.json 2>/dev/null || true)"

          echo "type=$TYPE status=$STATUS authorized=$AUTH has_name=$HAS_NAME has_area=$HAS_AREA"
          if [ "$AUTH" != "true" ]; then
            echo "reason=$REASON"
          fi

          test "$TYPE" = "object"
          test "$STATUS" = "success"
          test "$AUTH" = "true"
          test "$HAS_NAME" = "yes"
          test "$HAS_AREA" = "yes"
