<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal CIARM - Colegio Internacional Alemán</title>
  <link rel="stylesheet" href="./ciarm-theme.css">
</head>
<body style="margin: 0; background-color: #F3F4F6; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh;">

  <!-- Contenedor Principal de la SPA con Interfaz de Carga Garantizada -->
  <div id="app">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; padding: 2rem; text-align: center;">
      <h2 style="color: #1B2B48; margin-bottom: 0.5rem; font-size: 1.8rem;">Colegio Internacional Alemán</h2>
      <p style="color: #C5A059; font-weight: bold; font-size: 1.1rem; margin-bottom: 1.5rem;">Cargando Portal CIARM...</p>
      <div style="border: 4px solid #E5E7EB; border-top: 4px solid #C5A059; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- Carga Directa del Módulo Orquestador Principal con Anti-Caché -->
  <script type="module" src="./src/main.js?v=7.0.0"></script>

</body>
</html>
