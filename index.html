<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Intranet - Colegio CIARM</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/ciarm-theme.css">
</head>
<body>
  <header class="ciarm-header">
    <div class="ciarm-brand">
      <div id="header-logo">
        <h2>CIARM Intranet</h2>
      </div>
    </div>
    <div id="google-auth-container">
      <!-- Inyección del botón de login (Modo Dev o Google GIS) -->
    </div>
  </header>

  <div class="ciarm-container">
    <aside class="ciarm-sidebar" id="sidebar-container">
      <!-- Inyección del componente SidebarComponent -->
    </aside>

    <main class="ciarm-main-content">
      <section id="news-widget-container">
        <!-- Inyección del componente NewsWidgetComponent -->
      </section>
    </main>
  </div>

  <script type="module" src="src/auth/google-auth.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
