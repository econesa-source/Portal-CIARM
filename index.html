<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal CIARM - Colegio Internacional Alemán Riviera Maya</title>
  <link rel="stylesheet" href="ciarm-theme.css?v=11.0.2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div class="app-layout">
    <!-- Header Institucional -->
    <header class="main-header">
      <div class="brand">
        <img src="assets/css/escudo.svg" alt="Escudo CIARM" class="logo-escudo" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>COLEGIO INTERNACIONAL ALEMÁN</h1>
          <span>RIVIERA MAYA</span>
        </div>
      </div>
      <div class="header-title">
        <h2>Información y herramientas</h2>
      </div>
      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">Ezequiel Conesa</span>
          <span class="user-role">Cuenta Institucional</span>
        </div>
        <div class="user-avatar">EC</div>
        <button class="btn-logout">Cerrar sesión</button>
      </div>
    </header>

    <div class="content-wrapper">
      <!-- Sidebar de Navegación -->
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="#inicio" class="nav-link"><span class="icon">⌂</span> Inicio</a>
          <a href="#mis-solicitudes" class="nav-link active"><span class="icon">✓</span> Mis obligaciones</a>
          <a href="#solicitudes" class="nav-link"><span class="icon">≡</span> Normativa</a>
        </nav>
      </aside>

      <!-- Contenedor Dinámico Principal para la SPA -->
      <main id="main-content" class="main-body">
        <div class="loading-spinner">Cargando módulo...</div>
      </main>
    </div>
  </div>

  <script type="module" src="src/main.js?v=11.0.2"></script>
</body>
</html>
